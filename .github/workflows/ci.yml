name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  terraform:
    name: Terraform and routing checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      # Validation downloads providers but does not access AWS or Terraform state.
      - name: Initialise web tier without a backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate web tier
        run: terraform validate

      - name: Initialise public registry without a backend
        run: terraform -chdir=registry init -backend=false -input=false -lockfile=readonly

      - name: Validate public registry
        run: terraform -chdir=registry validate

      - name: Check shell syntax
        run: bash -n modules/web-tier/user-data.sh tests/container-smoke.sh

      - name: Test CloudFront routing
        run: node --test tests/routing.test.mjs

  container:
    name: ARM64 container build and smoke test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build ARM64 image
        run: docker buildx build --platform linux/arm64 --load --tag auto-healing-web-tier:ci .

      - name: Test HTTP, headers, IPv6, health and automatic restart
        run: bash tests/container-smoke.sh auto-healing-web-tier:ci
